name: Build & deploy masterlist

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - id: pages
        uses: actions/configure-pages@v5
      - name: Fetch server list snapshot
        id: data
        continue-on-error: true
        run: node scripts/build-data.js site/data/servers.json
      - name: Reuse previous snapshot
        if: steps.data.outcome != 'success'
        run: |
          mkdir -p site/data
          curl -fsSL "${{ steps.pages.outputs.base_url }}/data/servers.json" -o site/data/servers.json \
            || { echo "::error::No fresh data and no previous snapshot available"; exit 1; }
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
